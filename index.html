<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Demostración de aviso de cookies y enlace externo independiente.">
<title>Demostración | Preferencias de cookies</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d2431}
*{box-sizing:border-box}
body{margin:0;background:#484848;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(100%,380px);padding:28px 26px 24px;background:#fff;border-radius:17px;box-shadow:0 16px 38px #0003;text-align:center}
.symbol{width:55px;height:55px;display:grid;place-items:center;margin:0 auto 18px;background:#fff4ec;border-radius:50%;font-size:25px}
h1{font-size:19px;margin:0 0 12px}
p{font-size:13px;line-height:1.65;color:#646b78;margin:0 0 17px}
.actions{display:grid;gap:9px}
button,.continue{font:600 14px system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;display:block;width:100%;padding:13px 10px;border-radius:10px;text-align:center}
button.primary{background:#ed5b06;color:white;border:1px solid #ed5b06}
button.secondary{background:#fff;color:#3f4856;border:1px solid #dfe2e8}
button:hover,.continue:hover{filter:brightness(.95)}
.divider{border:0;border-top:1px solid #eaedf0;margin:20px 0 15px}
.continue{color:#1d4f95;background:#eef4ff;text-decoration:none}
.small{font-size:11px;line-height:1.5;color:#7e8794;margin:10px 0 0}
#feedback{min-height:18px;margin-top:8px}
</style>
</head>
<body>
<main class="card">
<div class="symbol" aria-hidden="true">🍪</div>
<h1>Uso de cookies</h1>
<div class="actions" aria-label="Preferencias de cookies">
<button id="accept" class="primary" type="button">Aceptar</button>
<button id="reject" class="secondary" type="button">Rechazar</button>
</div>
<p id="feedback" class="small" role="status" aria-live="polite"></p>
<hr class="divider">
<a class="continue" href="https://occidenteacceso.com/" rel="noopener noreferrer">Continuar a occidenteacceso.com/ ↗</a>
</main>
<script>
const feedback = document.getElementById("feedback");
const cookieName = "demo_cookie_preference";
document.getElementById("accept").addEventListener("click", () => {
  document.cookie = cookieName + "=accepted; Path=/; Max-Age=2592000; SameSite=Lax";
  feedback.textContent = "Preferencia guardada. Puedes continuar cuando quieras.";
});
document.getElementById("reject").addEventListener("click", () => {
  document.cookie = cookieName + "=; Path=/; Max-Age=0; SameSite=Lax";
  feedback.textContent = "Has rechazado la cookie opcional. Puedes continuar igualmente.";
});
</script>
</body>
</html>
